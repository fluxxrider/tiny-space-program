<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>render-video harness test page</title>
<!--
  Stand-in for films/ai-2027/index.html, used to develop and benchmark tools/render-video.mjs.
  Implements the render contract:
    window.__film = { ready: Promise<void>, duration, renderFrame(t), canvas }
  Workload (chosen to be representative for SwiftShader at 1920x1080):
    - RGBA16F HDR scene target: fullscreen domain-warped fbm nebula + ~100k additive GL points
    - bloom: bright-pass -> half-res H/V gaussian -> quarter-res H/V gaussian
    - 2D overlay canvas (big frame counter + timestamp) uploaded as a texture every frame
    - composite + ACES tonemap + vignette + grain into the default framebuffer
  Query params: render=1 (no self-animation, preserveDrawingBuffer), w, h, fps, dur (default 10),
    flash (time of the single pure-white frame, default 5.0), points (default 100000), octaves (default 6),
    test hooks: failAt=<t> (renderFrame throws for t >= failAt), hangAt=<t> (never resolves),
    readyDelay=<ms> (slow ready), noise=0 (skip fbm pass).
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script type="module">
const q = new URLSearchParams(location.search);
const RENDER = q.get('render') === '1';
const W = Math.round(+q.get('w') || 1920), H = Math.round(+q.get('h') || 1080);
const FPS = +q.get('fps') || 30;
const DURATION = q.has('dur') ? +q.get('dur') : 10;
const FLASH_AT = q.has('flash') ? +q.get('flash') : 5.0;
const NPOINTS = q.has('points') ? +q.get('points') : 100000;
const OCTAVES = q.has('octaves') ? +q.get('octaves') : 6;
const FAIL_AT = q.has('failAt') ? +q.get('failAt') : Infinity;
const HANG_AT = q.has('hangAt') ? +q.get('hangAt') : Infinity;
const READY_DELAY = +q.get('readyDelay') || 0;
const NOISE = q.get('noise') !== '0';

const canvas = document.getElementById('film');
canvas.width = W; canvas.height = H;
if (RENDER) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
else { canvas.style.width = '100vw'; canvas.style.height = (100 * H / W) + 'vw'; }

const gl = canvas.getContext('webgl2', {
  preserveDrawingBuffer: RENDER, antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: true, powerPreference: 'high-performance',
});
if (!gl) throw new Error('WebGL2 unavailable');
if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float'))
  throw new Error('float render targets unavailable');

// ---------- GL helpers ----------
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function target(w, h) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
    [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('incomplete RT');
  return { tex, fb, w, h };
}

const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0);
  vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0);
}`;

const NEBULA_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform float uT; uniform vec2 uRes;
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm(vec3 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < ${OCTAVES}; i++) { s += a * noise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; }
  return s;
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 p = vec3(uv * 2.2 + vec2(uT * 0.02, 0.0), uT * 0.04);
  vec2 w = vec2(fbm(p), fbm(p + vec3(5.2, 1.3, 2.1)));
  float n = fbm(p + vec3(2.2 * w, 0.0));
  vec3 col = mix(vec3(0.004, 0.006, 0.02), vec3(0.18, 0.06, 0.32), smoothstep(0.25, 0.75, n));
  col = mix(col, vec3(0.05, 0.25, 0.4), smoothstep(0.4, 0.9, w.x) * 0.6);
  col += vec3(2.4, 1.3, 0.55) * pow(smoothstep(0.55, 0.95, n), 4.0);
  o = vec4(col, 1.0);
}`;

const POINTS_VS = `#version 300 es
layout(location = 0) in vec4 aSeed;
uniform float uT; uniform vec2 uRes;
out vec3 vCol;
void main() {
  float r = 0.15 + 1.6 * pow(aSeed.y, 1.6);
  float arm = floor(aSeed.w * 3.0) * 2.0944;
  float ang = arm + r * 2.6 + (aSeed.x - 0.5) * 0.9 / (0.4 + r) + uT * (0.35 / (0.3 + r));
  vec3 pos = vec3(cos(ang) * r, (aSeed.z - 0.5) * 0.12 * (1.4 - min(r, 1.3)), sin(ang) * r);
  float ct = cos(0.5), st = sin(0.5);
  pos = vec3(pos.x, pos.y * ct - pos.z * st, pos.y * st + pos.z * ct);   // tilt
  pos.z += 2.6;
  vec2 ndc = pos.xy / pos.z * 1.9; ndc.x *= uRes.y / uRes.x;
  gl_Position = vec4(ndc, 0.0, 1.0);
  gl_PointSize = clamp((1.2 + 3.5 * fract(aSeed.x * 91.7)) * uRes.y / 1080.0 * 2.2 / pos.z, 1.0, 12.0);
  vec3 c = mix(vec3(0.6, 0.75, 1.6), vec3(1.8, 1.1, 0.6), smoothstep(0.1, 1.2, r));
  vCol = c * (0.35 + 1.4 * fract(aSeed.z * 53.1)) * (0.8 + 0.2 * sin(uT * 3.0 + aSeed.x * 40.0));
}`;
const POINTS_FS = `#version 300 es
precision highp float;
in vec3 vCol; out vec4 o;
void main() { vec2 d = gl_PointCoord * 2.0 - 1.0; float a = exp(-3.0 * dot(d, d)); o = vec4(vCol * a, 1.0); }`;

const BRIGHT_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uTex;
void main() { vec3 c = texture(uTex, vUv).rgb; float l = max(c.r, max(c.g, c.b)); o = vec4(c * smoothstep(0.7, 1.6, l), 1.0); }`;
const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uDir;
void main() {
  // 9-tap gaussian via 5 bilinear fetches
  vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
  c += (texture(uTex, vUv + uDir * 1.3846153846).rgb + texture(uTex, vUv - uDir * 1.3846153846).rgb) * 0.3162162162;
  c += (texture(uTex, vUv + uDir * 3.2307692308).rgb + texture(uTex, vUv - uDir * 3.2307692308).rgb) * 0.0702702703;
  o = vec4(c, 1.0);
}`;
const COMPOSITE_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uHalf, uQuarter, uOverlay; uniform float uT;
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec3 c = texture(uScene, vUv).rgb + 0.55 * texture(uHalf, vUv).rgb + 0.8 * texture(uQuarter, vUv).rgb;
  vec2 d = vUv - 0.5; c *= 1.0 - 0.9 * dot(d, d);
  c = pow(aces(c * 1.1), vec3(1.0 / 2.2));
  c += (h12(gl_FragCoord.xy + fract(uT * 7.13) * 917.0) - 0.5) / 255.0;   // dither/grain
  vec4 ov = texture(uOverlay, vec2(vUv.x, 1.0 - vUv.y));                    // premultiplied, top-down
  o = vec4(c * (1.0 - ov.a) + ov.rgb, 1.0);
}`;

const nebula = program(FULLSCREEN_VS, NEBULA_FS);
const points = program(POINTS_VS, POINTS_FS);
const bright = program(FULLSCREEN_VS, BRIGHT_FS);
const blur = program(FULLSCREEN_VS, BLUR_FS);
const composite = program(FULLSCREEN_VS, COMPOSITE_FS);

const scene = target(W, H);
const half = [target(W >> 1, H >> 1), target(W >> 1, H >> 1)];
const quarter = [target(W >> 2, H >> 2), target(W >> 2, H >> 2)];

// deterministic point seeds (mulberry32)
let seed = 1234567;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const seeds = new Float32Array(NPOINTS * 4); for (let i = 0; i < seeds.length; i++) seeds[i] = rnd();
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 0, 0);
const emptyVao = gl.createVertexArray();

// 2D overlay (frame counter + timestamp), uploaded as a texture every frame
const overlay = document.createElement('canvas'); overlay.width = W; overlay.height = H;
const octx = overlay.getContext('2d');
const overlayTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, overlayTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const FONT = '"DejaVu Sans", "Liberation Sans", sans-serif';
function drawOverlay(t) {
  const s = H / 1080;
  octx.clearRect(0, 0, W, H);
  octx.textBaseline = 'alphabetic';
  octx.fillStyle = 'rgba(255,255,255,0.92)';
  octx.font = `700 ${Math.round(300 * s)}px ${FONT}`;
  octx.textAlign = 'center';
  octx.fillText(String(Math.round(t * FPS)).padStart(4, '0'), W / 2, H * 0.62);
  octx.font = `500 ${Math.round(64 * s)}px ${FONT}`;
  octx.fillStyle = 'rgba(255,200,120,0.95)';
  octx.fillText(`t = ${t.toFixed(4)} s`, W / 2, H * 0.62 + 100 * s);
  octx.textAlign = 'left';
  octx.font = `400 ${Math.round(28 * s)}px ${FONT}`;
  octx.fillStyle = 'rgba(200,220,255,0.8)';
  octx.fillText(`harness-test  ${W}x${H}  ${FPS} fps  points=${NPOINTS}  octaves=${OCTAVES}`, 40 * s, H - 40 * s);
  octx.fillStyle = 'rgba(120,200,255,0.9)';
  octx.fillRect(40 * s, 40 * s, (W - 80 * s) * Math.min(1, Math.max(0, t / DURATION)), 10 * s);
  gl.bindTexture(gl.TEXTURE_2D, overlayTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, overlay);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
}

function fullscreen(prog, fb, w, h, uniforms, texs = []) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.viewport(0, 0, w, h);
  gl.useProgram(prog.p); gl.bindVertexArray(emptyVao);
  texs.forEach(([name, tex], i) => { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(prog.u[name], i); });
  uniforms?.(prog.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function draw(t) {
  // pure white frame at FLASH_AT (exactly one frame) for A/V sync tests
  if (t >= FLASH_AT - 1e-9 && t < FLASH_AT + 1 / FPS - 1e-9) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT); return;
  }
  gl.disable(gl.BLEND);
  if (NOISE) fullscreen(nebula, scene.fb, W, H, u => { gl.uniform1f(u.uT, t); gl.uniform2f(u.uRes, W, H); });
  else { gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fb); gl.viewport(0, 0, W, H); gl.clearColor(0.01, 0.01, 0.03, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  // points, additive into the HDR target
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(points.p); gl.uniform1f(points.u.uT, t); gl.uniform2f(points.u.uRes, W, H);
  gl.bindVertexArray(vao); gl.drawArrays(gl.POINTS, 0, NPOINTS);
  gl.disable(gl.BLEND);
  // bloom chain
  fullscreen(bright, half[0].fb, half[0].w, half[0].h, null, [['uTex', scene.tex]]);
  fullscreen(blur, half[1].fb, half[1].w, half[1].h, u => gl.uniform2f(u.uDir, 1 / half[0].w, 0), [['uTex', half[0].tex]]);
  fullscreen(blur, half[0].fb, half[0].w, half[0].h, u => gl.uniform2f(u.uDir, 0, 1 / half[0].h), [['uTex', half[1].tex]]);
  fullscreen(blur, quarter[0].fb, quarter[0].w, quarter[0].h, u => gl.uniform2f(u.uDir, 1 / half[0].w, 0), [['uTex', half[0].tex]]);
  fullscreen(blur, quarter[1].fb, quarter[1].w, quarter[1].h, u => gl.uniform2f(u.uDir, 1 / quarter[0].w, 0), [['uTex', quarter[0].tex]]);
  fullscreen(blur, quarter[0].fb, quarter[0].w, quarter[0].h, u => gl.uniform2f(u.uDir, 0, 1 / quarter[0].h), [['uTex', quarter[1].tex]]);
  drawOverlay(t);
  fullscreen(composite, null, W, H, u => gl.uniform1f(u.uT, t),
    [['uScene', scene.tex], ['uHalf', half[0].tex], ['uQuarter', quarter[0].tex], ['uOverlay', overlayTex]]);
}

async function renderFrame(t) {
  if (t >= HANG_AT) return new Promise(() => {});
  if (t >= FAIL_AT) throw new Error(`harness-test: injected failure at t=${t}`);
  draw(t);
}

const ready = (async () => {
  await document.fonts.ready;
  await document.fonts.load(`700 300px ${FONT}`);
  if (READY_DELAY) await new Promise(r => setTimeout(r, READY_DELAY));
  draw(0.5);                                   // warm-up: SwiftShader JIT-compiles every pipeline on first use
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
})();

window.__film = { ready, duration: DURATION, renderFrame, canvas };

if (!RENDER) {
  const t0 = performance.now();
  ready.then(() => { const loop = () => { draw(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); });
}
</script>
</body>
</html>
